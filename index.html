<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKR 3D Office Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0f172a; }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
</head>
<body class="text-slate-100 font-sans antialiased">

  <!-- UI Dashboard Realtime Overlay -->
  <div class="absolute top-4 right-4 z-10 w-80 bg-slate-800/90 text-white p-4 rounded-xl shadow-2xl border border-slate-700 backdrop-blur-md">
    <h2 class="text-lg font-bold border-b border-slate-700 pb-2 mb-3 flex items-center justify-between">
      <span>📊 Trạng thái OKR Realtime</span>
      <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse" title="Live"></span>
    </h2>
    <div id="user-list" class="space-y-3 max-h-[80vh] overflow-y-auto pr-1">
      <p class="text-xs text-slate-400">Đang đồng bộ dữ liệu từ Lark Base...</p>
    </div>
  </div>

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <script>
    // 1. URL Worker API của bạn
    const WORKER_API_URL = "https://okr-office-worker.loceducate.workers.dev/api/status";

    // 2. Khởi tạo Three.js Isometric 3D Scene
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const aspect = window.innerWidth / window.innerHeight;
    const d = 10;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
    camera.position.set(20, 20, 20);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Ánh sáng
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(15, 25, 15);
    scene.add(dirLight);

    // Sàn văn phòng isometric
    const floorGeometry = new THREE.BoxGeometry(14, 0.5, 14);
    const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x1e293b });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.position.y = -0.25;
    scene.add(floor);

    // Bàn làm việc mẫu
    const deskGeo = new THREE.BoxGeometry(3, 1.2, 1.8);
    const deskMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
    
    const desk1 = new THREE.Mesh(deskGeo, deskMat);
    desk1.position.set(-3, 0.6, -2);
    scene.add(desk1);

    const desk2 = new THREE.Mesh(deskGeo, deskMat);
    desk2.position.set(3, 0.6, 2);
    scene.add(desk2);

    // Khối nhân sự (Avatar 3D)
    const avatarGeo = new THREE.BoxGeometry(1, 1, 1);
    const avatarMat = new THREE.MeshLambertMaterial({ color: 0x3b82f6 });
    const avatar = new THREE.Mesh(avatarGeo, avatarMat);
    avatar.position.set(-3, 1.7, -2);
    scene.add(avatar);

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      avatar.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();

    // Resize Window Handler
    window.addEventListener('resize', () => {
      const newAspect = window.innerWidth / window.innerHeight;
      camera.left = -d * newAspect;
      camera.right = d * newAspect;
      camera.top = d;
      camera.bottom = -d;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 3. Hàm Fetch và Render dữ liệu Realtime từ Cloudflare Worker
    async function fetchStatus() {
      try {
        const response = await fetch(WORKER_API_URL);
        const data = await response.json();

        // Kiểm tra xem API có trả về object state hay không
        const states = data.state || data; 
        const userListEl = document.getElementById("user-list");
        userListEl.innerHTML = ""; 

        const owners = Object.keys(states).filter(k => k !== "success" && k !== "error");

        if (owners.length === 0) {
          userListEl.innerHTML = '<p class="text-xs text-slate-400">Chưa có dữ liệu nhiệm vụ.</p>';
          return;
        }

        owners.forEach(owner => {
          const item = states[owner];
          // Đảm bảo item là object chứa dữ liệu task
          if (!item || typeof item !== 'object') return;

          let statusBadgeColor = "bg-blue-500/20 text-blue-300 border-blue-500/30";
          const statusText = item.status || "Đang làm";
          if (statusText.includes("Nộp") || statusText.includes("Hoàn thành")) {
            statusBadgeColor = "bg-emerald-500/20 text-emerald-300 border-emerald-500/30";
          } else if (statusText.includes("Đang")) {
            statusBadgeColor = "bg-amber-500/20 text-amber-300 border-amber-500/30";
          }

          const userCard = document.createElement("div");
          userCard.className = "bg-slate-700/60 p-3 rounded-lg border border-slate-600 shadow-sm";
          userCard.innerHTML = `
            <div class="flex justify-between items-center mb-1.5">
              <span class="font-bold text-sm text-slate-100">👤 ${owner}</span>
              <span class="text-[11px] px-2 py-0.5 rounded border font-medium ${statusBadgeColor}">
                ${statusText}
              </span>
            </div>
            <div class="text-xs text-slate-300 bg-slate-800/80 p-2 rounded border border-slate-700/50">
              📌 <span class="font-medium text-slate-200">Task:</span> ${item.current_task || item.task_name || "Không có task"}
            </div>
          `;
          userListEl.appendChild(userCard);
        });
      } catch (err) {
        console.error("Lỗi kết nối API:", err);
      }
    }

    // Tự động gọi API mỗi 3 giây để cập nhật realtime
    fetchStatus();
    setInterval(fetchStatus, 3000);
  </script>
</body>
</html>
